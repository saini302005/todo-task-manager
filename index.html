<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="todo-container">

        <h1>To-Do Task Manager</h1>

        <p class="subtitle">
            Organize your tasks and stay productive.
        </p>


        <!-- ==================== ADD TASK ==================== -->

        <div class="task-input-container">

            <input
                type="text"
                id="task-input"
                placeholder="Enter your task..."
            >

            <button id="add-task-button">
                Add Task
            </button>

        </div>


        <!-- ==================== FILTERS ==================== -->

        <div class="filters">

            <button
                class="filter-button active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter-button"
                data-filter="active"
            >
                Active
            </button>

            <button
                class="filter-button"
                data-filter="completed"
            >
                Completed
            </button>

        </div>


        <!-- ==================== TASK LIST ==================== -->

        <ul id="task-list"></ul>


        <!-- ==================== TASK ACTIONS ==================== -->

        <div class="task-actions">

            <p id="task-count">
                0 tasks remaining
            </p>

            <button id="clear-completed-button">
                Clear Completed
            </button>

        </div>

    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
